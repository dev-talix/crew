name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run test
      # Also builds dist/, which the Rust crate embeds.
      - run: bun run build

      # rustup reads src-tauri/rust-toolchain.toml and installs that toolchain on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Skips the ignored live CLI tests, which need logged-in codex and claude and cost tokens.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
